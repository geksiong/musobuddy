<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#4f46e5" stroke-width="4" stroke-opacity="0.3" />

  <!-- Metronome Frame & Soundwaves -->
  <g filter="url(#glow)" stroke="url(#accent-grad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Metronome Shape -->
    <path d="M 180 390 L 220 150 L 292 150 L 332 390 Z" stroke-width="16" />
    <line x1="160" y1="390" x2="352" y2="390" stroke-width="16" />
    
    <!-- Metronome Pendulum -->
    <line x1="256" y1="350" x2="320" y2="170" stroke-width="14" stroke="#ec4899" />
    <circle cx="308" cy="204" r="22" fill="#8b5cf6" stroke="url(#accent-grad)" stroke-width="8" />

    <!-- Musical Sound Waves (Left) -->
    <path d="M 120 220 A 50 50 0 0 0 120 300" stroke-width="12" opacity="0.8" />
    <path d="M 88 190 A 90 90 0 0 0 88 330" stroke-width="10" opacity="0.5" />

    <!-- Musical Sound Waves (Right) -->
    <path d="M 392 220 A 50 50 0 0 1 392 300" stroke-width="12" opacity="0.8" />
    <path d="M 424 190 A 90 90 0 0 1 424 330" stroke-width="10" opacity="0.5" />

    <!-- Music Note Accent Top Left -->
    <path d="M 170 110 C 170 110 200 90 230 110 L 230 160" stroke-width="10" />
    <circle cx="160" cy="150" r="14" fill="url(#accent-grad)" />
  </g>
</svg>
